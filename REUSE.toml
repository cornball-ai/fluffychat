version = 1

[[annotations]]
path = [
    ".mailmap",
    ".tool_versions.yaml",
    "pubspec.lock",
    "*.json",
    ".vscode/**",
    "lib/l10n/**",
    "assets/vodozemac/**",
    ".github/**",
    ".gitignore",
    ".metadata",
    "android/**",
    "ios/**",
    "linux/**",
    "macos/**",
    "integration_test/.gitignore",
    "integration_test/data/**",
    "integration_test/synapse/**",
    "snap/**",
    "windows/**",
    "web/**"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2019-Present Christian Kußowski"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Generated by protoc-gen-dart from proto/*.proto; headers would be lost on
# regeneration, so the annotation lives here instead.
[[annotations]]
path = [
    "lib/utils/voice/proto/**"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026-Present cornball.ai"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = [
    "assets/sounds/**"
]
SPDX-FileCopyrightText = "Pixabay"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = [
    "assets/sas-emoji.json"
]
SPDX-FileCopyrightText = "Matrix Foundation"
SPDX-License-Identifier = "Apache-2.0"

# Bundled theme fonts
[[annotations]]
path = [
    "assets/fonts/Cantarell-*.otf"
]
SPDX-FileCopyrightText = "2009-2011 Understanding Limited, 2010-2011 Jakub Steiner"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = [
    "assets/fonts/Comfortaa-*.ttf"
]
SPDX-FileCopyrightText = "2011 The Comfortaa Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = [
    "assets/fonts/Caladea-*.ttf"
]
SPDX-FileCopyrightText = "2012 The Caladea Project Authors"
SPDX-License-Identifier = "OFL-1.1"

# App Logo
[[annotations]]
path = [
    "assets/logo/**",
    "android/app/src/main/res/mipmap**/**",
    "ios/Runner/Assets.xcassets/AppIcon.appiconset/**",
    "macos/Runner/Assets.xcassets/AppIcon.appiconset/**",
    "web/icons/**",
    "web/splash/**",
    "snap/gui/*.png",
    "windows/runner/resources/app_icon.ico"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2017-Present Fabiyamada"
SPDX-License-Identifier = "CC-BY-4.0"